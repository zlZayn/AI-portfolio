    text: AI 生成内容不可信，但经过引用完整性 + 双向一致性校验的内容可以。schema.json 是唯一真相源，改 Schema 验证和生成自动适应，防静默遗漏。
  - title: 数据规范构建
    text: 所有实体统一字段命名、`{type}_ids` 数组式引用、标签唯一来源——13 个 JSON 遵守同一套规范，验证器自动校验，坏数据进不了页面。
