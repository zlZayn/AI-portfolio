<svg class="editorial-diagram editorial-diagram-imagora diagram-typography-expanded" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="100%" role="img" aria-labelledby="imagora-title imagora-desc" preserveAspectRatio="xMidYMid meet"><title id="imagora-title">Imagora dual-mode image generation workbench</title><desc id="imagora-desc">Contract-formatted prompts import as batch cards; classic form and infinite canvas share one task pipeline; generated results are stored by content hash and rebound as canvas nodes for chained iteration.</desc><defs><marker id="imagora-arrow-default" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker><marker id="imagora-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker><marker id="imagora-arrow-success" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f7652"/></marker><marker id="imagora-arrow-danger" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a34444"/></marker></defs><style>
