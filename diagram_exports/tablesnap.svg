<svg class="editorial-diagram editorial-diagram-tablesnap diagram-typography-standard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" role="img" aria-labelledby="tablesnap-title tablesnap-desc" preserveAspectRatio="xMidYMid meet"><title id="tablesnap-title">tablesnap direct visual table extraction</title><desc id="tablesnap-desc">Hotkey captures and batch images converge on one local visual-language-model call and a shared XLSX exporter.</desc><defs><marker id="tablesnap-arrow-default" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tablesnap-arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tablesnap-arrow-success" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#2f7652" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tablesnap-arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#a34444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
.editorial-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;fill:#2d2b55;letter-spacing:0}
.zone>rect:first-child{fill:#2d2b55;fill-opacity:.018;stroke:#d1d5db;stroke-width:1}
.zone-label-mask{fill:#faf6ef}
.connector-label rect{fill:#faf6ef;fill-opacity:.82}
.zone-label,.node-tag,.connector-label text,.label-eyebrow{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5f6368}
.lane rect{fill:#faf6ef;stroke:#e5e7eb;stroke-width:1}.lane-tinted rect{fill:#2d2b55;fill-opacity:.018}
.lane line{stroke:#d1d5db;stroke-width:1}.lane-label{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;fill:#5f6368;letter-spacing:.06em}
.connector{fill:none;stroke:#5f6368;stroke-width:1.5}
.connector-accent{stroke:#c2410c;stroke-width:2}
.connector-success{stroke:#2f7652}.connector-danger{stroke:#a34444}
.connector-dashed{stroke-dasharray:6 4}
.node-mask,.decision-mask{fill:#faf6ef;stroke:none}
.node-box{fill:#ffffff;stroke:#2d2b55;stroke-width:1.25}
.node-muted .node-box{fill:#faf6ef;stroke:#d1d5db}
.node-store .node-box{fill:#2d2b55;fill-opacity:.045;stroke:#5f6368}
.node-optional .node-box{fill:#faf6ef;stroke:#d1d5db;stroke-dasharray:6 4}
.node-focal .node-box{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
.node-success .node-box{fill:#f0f7f2;stroke:#2f7652}
.node-danger .node-box{fill:#fdf2f2;stroke:#a34444}
.node-tag-box{fill:none;stroke:#5f6368;stroke-opacity:.5}
.node-focal .node-tag-box{stroke:#c2410c}.node-focal .node-tag{fill:#c2410c}
.node-title,.decision-title{font-size:13px;font-weight:650}
.node-subtitle,.decision-subtitle{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:10px;fill:#5f6368}
.decision-box{fill:#ffffff;stroke:#2d2b55;stroke-width:1.25}
.decision-focal .decision-box{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
.connector-label rect{stroke:#e5e7eb;stroke-width:.5}
.connector-label-accent rect{stroke:#c2410c;stroke-opacity:.45}.connector-label-accent text{fill:#c2410c}
.connector-label-success rect{stroke:#2f7652;stroke-opacity:.45}.connector-label-success text{fill:#2f7652}
.connector-label-danger rect{stroke:#a34444;stroke-opacity:.45}.connector-label-danger text{fill:#a34444}
.connector-label-dashed rect{stroke:#5f6368;stroke-dasharray:3 2}.connector-label-dashed text{fill:#5f6368}
.annotation line{stroke:#c2410c;stroke-width:2}.annotation text{font-size:12px;font-style:italic}
.label-metric{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:12px;font-weight:600;fill:#c2410c}
.step-header rect{fill:#2d2b55;fill-opacity:.1}.step-header text{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;fill:#5f6368}
.step-header .step-label{letter-spacing:.06em}.step-focal rect{fill:#f97316;fill-opacity:.16}.step-focal text{fill:#c2410c}
.diagram-typography-expanded .zone-label,.diagram-typography-expanded .node-tag,.diagram-typography-expanded .connector-label text,.diagram-typography-expanded .label-eyebrow{font-size:12px}
.diagram-typography-expanded .node-title,.diagram-typography-expanded .decision-title{font-size:14px}
.diagram-typography-expanded .node-subtitle,.diagram-typography-expanded .decision-subtitle{font-size:10px}
.diagram-typography-expanded .annotation text{font-size:13px}
</style><rect width="960" height="460" fill="#faf6ef"/><g class="zone"><rect x="320" y="112" width="608" height="240" rx="8"/><rect class="zone-label-mask" x="336" y="108" width="200" height="16" rx="4"/><text class="zone-label" x="344" y="120">LOCAL PROCESSING BOUNDARY</text></g><path class="connector connector-default" d="M 224 164 L 272 164 Q 280 164 280 172 L 280 200 Q 280 208 288 208 L 368 208" marker-end="url(#tablesnap-arrow-default)"/><path class="connector connector-default" d="M 224 324 L 288 324 Q 296 324 296 316 L 296 264 Q 296 256 304 256 L 368 256" marker-end="url(#tablesnap-arrow-default)"/><path class="connector connector-accent" d="M 560 232 L 624 232" marker-end="url(#tablesnap-arrow-accent)"/><path class="connector connector-default" d="M 768 232 L 816 232" marker-end="url(#tablesnap-arrow-default)"/><g class="node node-muted"><rect class="node-mask" x="48" y="128" width="176" height="76" rx="8"/><rect class="node-box" x="48" y="128" width="176" height="76" rx="8"/><rect class="node-tag-box" x="60" y="136" width="40" height="16" rx="4"/><text class="node-tag" x="80" y="148" text-anchor="middle">GUI</text><text class="node-title" text-anchor="middle"><tspan x="136" y="168">Hotkey capture</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="136" y="188">drag screen region</tspan></text></g><g class="node node-muted"><rect class="node-mask" x="48" y="288" width="176" height="76" rx="8"/><rect class="node-box" x="48" y="288" width="176" height="76" rx="8"/><rect class="node-tag-box" x="60" y="296" width="52" height="16" rx="4"/><text class="node-tag" x="86" y="308" text-anchor="middle">FILES</text><text class="node-title" text-anchor="middle"><tspan x="136" y="328">Batch images</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="136" y="348">PNG / JPG / WEBP</tspan></text></g><g class="node node-focal"><rect class="node-mask" x="368" y="192" width="192" height="80" rx="8"/><rect class="node-box" x="368" y="192" width="192" height="80" rx="8"/><rect class="node-tag-box" x="380" y="200" width="72" height="16" rx="4"/><text class="node-tag" x="416" y="212" text-anchor="middle">LOCAL AI</text><text class="node-title" text-anchor="middle"><tspan x="464" y="232">ONE VLM CALL</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="464" y="252">Qwen3-VL via Ollama</tspan></text></g><g class="node node-store"><rect class="node-mask" x="624" y="196" width="144" height="76" rx="8"/><rect class="node-box" x="624" y="196" width="144" height="76" rx="8"/><rect class="node-tag-box" x="636" y="204" width="44" height="16" rx="4"/><text class="node-tag" x="658" y="216" text-anchor="middle">TEXT</text><text class="node-title" text-anchor="middle"><tspan x="696" y="236">PSV rows</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="696" y="256">pipe-separated</tspan></text></g><g class="node node-success"><rect class="node-mask" x="816" y="196" width="112" height="76" rx="8"/><rect class="node-box" x="816" y="196" width="112" height="76" rx="8"/><rect class="node-tag-box" x="828" y="204" width="60" height="16" rx="4"/><text class="node-tag" x="858" y="216" text-anchor="middle">OUTPUT</text><text class="node-title" text-anchor="middle"><tspan x="872" y="236">XLSX</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="872" y="256">openpyxl</tspan></text></g><text class="label label-eyebrow" x="32" y="32" text-anchor="start">TWO INPUT MODES / ONE VISUAL CORE</text><g class="annotation"><line x1="360" y1="400" x2="384" y2="400"/><text x="396" y="404">NO OCR PIPELINE / NO LAYOUT RECONSTRUCTION</text></g></svg>