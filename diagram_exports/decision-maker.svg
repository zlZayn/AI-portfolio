x="8"/><rect class="node-box" x="712" y="376" width="160" height="80" rx="8"/><rect class="node-tag-box" x="724" y="384" width="32" height="16" rx="4"/><text class="node-tag" x="740" y="396" text-anchor="middle">AI</text><text class="node-title" text-anchor="middle"><tspan x="792" y="416">Field signals</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="792" y="436">one char / field</tspan></text></g><g class="node node-focal"><rect class="node-mask" x="536" y="216" width="184" height="104" rx="8"/><rect class="node-box" x="536" y="216" width="184" height="104" rx="8"/><rect class="node-tag-box" x="548" y="224" width="44" height="16" rx="4"/><text class="node-tag" x="570" y="236" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="628" y="252">VALIDATE</tspan><tspan x="628" y="268">+ ASSEMBLE</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="628" y="280">operation registry</tspan></text></g><g class="node node-default"><rect class="node-mask" x="768" y="216" width="144" height="80" rx="8"/><rect class="node-box" x="768" y="216" width="144" height="80" rx="8"/><rect class="node-tag-box" x="780" y="224" width="44" height="16" rx="4"/><text class="node-tag" x="802" y="236" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="840" y="256">Local execute</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="840" y="276">quality report</tspan></text></g><g class="node node-success"><rect class="node-mask" x="768" y="96" width="144" height="76" rx="8"/><rect class="node-box" x="768" y="96" width="144" height="76" rx="8"/><rect class="node-tag-box" x="780" y="104" width="60" height="16" rx="4"/><text class="node-tag" x="810" y="116" text-anchor="middle">OUTPUT</text><text class="node-title" text-anchor="middle"><tspan x="840" y="136">Clean data</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="840" y="156">deterministic</tspan></text></g><text class="label label-eyebrow" x="32" y="32" text-anchor="start">AI PROPOSES COMPACT SIGNALS / CODE OWNS EVERY WRITE</text><g class="connector-label connector-label-accent"><rect x="258" y="112" width="108" height="16" rx="4"/><text x="312" y="124" text-anchor="middle">HIT / 0 TOKEN</text></g><g class="connector-label connector-label-default"><rect x="290" y="384" width="44" height="16" rx="4"/><text x="312" y="396" text-anchor="middle">MISS</text></g><g class="annotation"><line x1="48" y1="568" x2="72" y2="568"/><text x="84" y="572">Full rows never go to AI; invalid signals fall back before execution.</text></g></svg>