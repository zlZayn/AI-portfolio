<svg class="editorial-diagram editorial-diagram-decision-maker diagram-typography-standard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" role="img" aria-labelledby="decision-maker-title decision-maker-desc" preserveAspectRatio="xMidYMid meet"><title id="decision-maker-title">AI-decision-maker cache-aware signal architecture</title><desc id="decision-maker-desc">A deterministic profile and fingerprint either reuse cached semantic signals or request two constrained AI codes. Code validates, assembles registered operations, and executes every data write locally.</desc><defs><marker id="decision-maker-arrow-default" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="decision-maker-arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="decision-maker-arrow-success" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#2f7652" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="decision-maker-arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#a34444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
.editorial-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;fill:#2d2b55;letter-spacing:0}
.zone>rect:first-child{fill:#2d2b55;fill-opacity:.018;stroke:#d1d5db;stroke-width:1}
