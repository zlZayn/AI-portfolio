EFINITION</text><g class="connector-label connector-label-default"><rect x="732" y="236" width="88" height="16" rx="4"/><text x="776" y="248" text-anchor="middle">CODE TOOLS</text></g><g class="connector-label connector-label-dashed"><rect x="808" y="116" width="80" height="16" rx="4"/><text x="848" y="128" text-anchor="middle">READ ONLY</text></g><g class="annotation"><line x1="48" y1="484" x2="72" y2="484"/><text x="84" y="488">TWO PROTOCOLS change transport, not tool ownership.</text></g></svg>