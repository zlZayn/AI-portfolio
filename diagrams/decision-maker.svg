x" x="60" y="296" width="44" height="16" rx="4"/><text class="node-tag" x="82" y="308" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="112" y="328">CSV profile</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="112" y="348">fields + samples</tspan></text></g><g class="decision"><polygon class="decision-mask" points="264,276 328,328 264,380 200,328"/><polygon class="decision-box" points="264,276 328,328 264,380 200,328"/><text class="decision-title" text-anchor="middle"><tspan x="264" y="324">Fingerprint</tspan></text><text class="decision-subtitle" x="264" y="352" text-anchor="middle">cached?</text></g><g class="node node-store"><rect class="node-mask" x="400" y="104" width="208" height="80" rx="8"/><rect class="node-box" x="400" y="104" width="208" height="80" rx="8"/><rect class="node-tag-box" x="412" y="112" width="68" height="16" rx="4"/><text class="node-tag" x="446" y="124" text-anchor="middle">0 TOKEN</text><text class="node-title" text-anchor="middle"><tspan x="504" y="144">Cached signals</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="504" y="164">scene + field codes</tspan></text></g><g class="node node-muted"><rect class="node-mask" x="400" y="232" width="208" height="72" rx="8"/><rect class="node-box" x="400" y="232" width="208" height="72" rx="8"/><rect class="node-tag-box" x="412" y="240" width="44" height="16" rx="4"/><text class="node-tag" x="434" y="252" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="504" y="272">System 0</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="504" y="292">local lookup · 0 TOKEN</tspan></text></g><g class="node node-default"><rect class="node-mask" x="400" y="352" width="208" height="72" rx="8"/><rect class="node-box" x="400" y="352" width="208" height="72" rx="8"/><rect class="node-tag-box" x="412" y="360" width="32" height="16" rx="4"/><text class="node-tag" x="428" y="372" text-anchor="middle">AI</text><text class="node-title" text-anchor="middle"><tspan x="504" y="392">System 1 · Jev</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="504" y="412">probability, not text</tspan></text></g><g class="node node-default"><rect class="node-mask" x="400" y="472" width="208" height="72" rx="8"/><rect class="node-box" x="400" y="472" width="208" height="72" rx="8"/><rect class="node-tag-box" x="412" y="480" width="32" height="16" rx="4"/><text class="node-tag" x="428" y="492" text-anchor="middle">AI</text><text class="node-title" text-anchor="middle"><tspan x="504" y="512">System 2 · LLM</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="504" y="532">generated text</tspan></text></g><g class="decision decision-focal"><polygon class="decision-mask" points="736,336 808,388 736,440 664,388"/><polygon class="decision-box" points="736,336 808,388 736,440 664,388"/><text class="decision-title" text-anchor="middle"><tspan x="736" y="384">Gate</tspan></text><text class="decision-subtitle" x="736" y="412" text-anchor="middle">CODE</text></g><g class="node node-default"><rect class="node-mask" x="648" y="224" width="176" height="88" rx="8"/><rect class="node-box" x="648" y="224" width="176" height="88" rx="8"/><rect class="node-tag-box" x="660" y="232" width="44" height="16" rx="4"/><text class="node-tag" x="682" y="244" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="736" y="260">VALIDATE</tspan><tspan x="736" y="276">+ ASSEMBLE</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="736" y="288">operation registry</tspan></text></g><g class="node node-default"><rect class="node-mask" x="656" y="104" width="160" height="72" rx="8"/><rect class="node-box" x="656" y="104" width="160" height="72" rx="8"/><rect class="node-tag-box" x="668" y="112" width="44" height="16" rx="4"/><text class="node-tag" x="690" y="124" text-anchor="middle">CODE</text><text class="node-title" text-anchor="middle"><tspan x="736" y="144">Local execute</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="736" y="164">quality report</tspan></text></g><g class="node node-success"><rect class="node-mask" x="832" y="104" width="96" height="72" rx="8"/><rect class="node-box" x="832" y="104" width="96" height="72" rx="8"/><rect class="node-tag-box" x="844" y="112" width="60" height="16" rx="4"/><text class="node-tag" x="874" y="124" text-anchor="middle">OUTPUT</text><text class="node-title" text-anchor="middle"><tspan x="880" y="144">Clean data</tspan></text><text class="node-subtitle" text-anchor="middle"><tspan x="880" y="164">deterministic</tspan></text></g><text class="label label-eyebrow" x="32" y="32" text-anchor="start">AI PROPOSES SIGNALS / CODE OWNS EVERY WRITE</text><g class="connector-label connector-label-accent"><rect x="278" y="112" width="108" height="16" rx="4"/><text x="332" y="124" text-anchor="middle">HIT / 0 TOKEN</text></g><g class="connector-label connector-label-default"><rect x="322" y="236" width="44" height="16" rx="4"/><text x="344" y="248" text-anchor="middle">MISS</text></g><g class="connector-label connector-label-success"><rect x="738" y="312" width="60" height="16" rx="4"/><text x="768" y="324" text-anchor="middle">ACCEPT</text></g><g class="connector-label connector-label-accent"><rect x="664" y="476" width="72" height="16" rx="4"/><text x="700" y="488" text-anchor="middle">ESCALATE</text></g><g class="annotation"><line x1="48" y1="616" x2="72" y2="616"/><text x="84" y="620">Jev returns probabilities, not text — invalid codes are unrepresentable. Measured: 1.9–3.5× DeepSeek&#x27;s cost.</text></g></svg>