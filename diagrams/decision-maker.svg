<svg class="editorial-diagram editorial-diagram-decision-maker diagram-typography-standard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" role="img" aria-labelledby="decision-maker-title decision-maker-desc" preserveAspectRatio="xMidYMid meet"><title id="decision-maker-title">AI-decision-maker three-engine routing</title><desc id="decision-maker-desc">A deterministic profile and fingerprint either reuse cached signals at zero token cost or escalate a judgement through three engines: local lookup, a probability engine, and a generative model. Code gates every confidence and owns every write.</desc><defs><marker id="decision-maker-arrow-default" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker><marker id="decision-maker-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/></marker><marker id="decision-maker-arrow-success" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f7652"/></marker><marker id="decision-maker-arrow-danger" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a34444"/></marker></defs><style>
.editorial-diagram text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;fill:#2d2b55;letter-spacing:0}
.zone>rect:first-child{fill:#2d2b55;fill-opacity:.018;stroke:#d1d5db;stroke-width:1}
.zone-label-mask,.connector-label rect{fill:#faf6ef}
.zone-label,.node-tag,.connector-label text,.label-eyebrow{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;fill:#5f6368}
.lane rect{fill:#faf6ef;stroke:#e5e7eb;stroke-width:1}.lane-tinted rect{fill:#2d2b55;fill-opacity:.018}
.lane line{stroke:#d1d5db;stroke-width:1}.lane-label{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;fill:#5f6368;letter-spacing:.06em}
.connector{fill:none;stroke:#5f6368;stroke-width:1.5}
.connector-accent{stroke:#c2410c;stroke-width:2}
.connector-success{stroke:#2f7652}.connector-danger{stroke:#a34444}
.connector-dashed{stroke-dasharray:6 4}
.node-mask,.decision-mask{fill:#faf6ef;stroke:none}
.node-box{fill:#ffffff;stroke:#2d2b55;stroke-width:1.25}
.node-muted .node-box{fill:#faf6ef;stroke:#d1d5db}
