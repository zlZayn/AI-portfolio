.node-focal .node-tag-box{stroke:#c2410c}.node-focal .node-tag{fill:#c2410c}
.node-title,.decision-title{font-size:13px;font-weight:650}
.node-subtitle,.decision-subtitle{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:10px;fill:#5f6368}
.decision-box{fill:#ffffff;stroke:#2d2b55;stroke-width:1.25}
.decision-focal .decision-box{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
.connector-label rect{stroke:#e5e7eb;stroke-width:.5}
.connector-label-accent rect{stroke:#c2410c;stroke-opacity:.45}.connector-label-accent text{fill:#c2410c}
.connector-label-success rect{stroke:#2f7652;stroke-opacity:.45}.connector-label-success text{fill:#2f7652}
.connector-label-danger rect{stroke:#a34444;stroke-opacity:.45}.connector-label-danger text{fill:#a34444}
.connector-label-dashed rect{stroke:#5f6368;stroke-dasharray:3 2}.connector-label-dashed text{fill:#5f6368}
.annotation line{stroke:#c2410c;stroke-width:2}.annotation text{font-size:12px;font-style:italic}
.label-metric{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:12px;font-weight:600;fill:#c2410c}
.step-header rect{fill:#2d2b55;fill-opacity:.1}.step-header text{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace;font-size:11px;font-weight:600;fill:#5f6368}
.step-header .step-label{letter-spacing:.06em}.step-focal rect{fill:#f97316;fill-opacity:.16}.step-focal text{fill:#c2410c}
.diagram-typography-expanded .zone-label,.diagram-typography-expanded .node-tag,.diagram-typography-expanded .connector-label text,.diagram-typography-expanded .label-eyebrow{font-size:12px}
