# CI —— 只读质检：不写回仓库，不做任何发布动作。
#
# 与 static.yml 的分工（本文件不碰 deployment）：
#   - static.yml：纯 Pages 部署（上传整仓，无任何构建/质检步）
#   - 本文件：源码闸（ruff lint + 格式 + 单元测试）
#
# 注意：本文件是**独立**的质检 workflow，刻意不塞进 static.yml ——
# 部署链的行为保持不变，质检红不会顺手改掉发布路径。
#
# 判据单一来源：
#   - Ruff 版本来自 pyproject.toml 的 [dependency-groups] dev，锁在 uv.lock；
#   - Python 版本来自仓内 .python-version（由 uv 解析）；
#   - 安装统一 `uv sync --frozen`。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff · Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 本仓 tests/ 有 4 个 test_*.py（build / content_contract / diagram_svg / diagrams）。
      - name: Pytest
        run: uv run pytest
